<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhruv — Portfolio</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* =========================================================
   INTRO
========================================================= */

#intro{
  position:fixed;
  inset:0;
  z-index:1000;
  width:100%;
  height:100vh;
  height:100svh;
  background:#fff;
  display:grid;
  place-items:center;
  overflow:hidden;
}

#greeting{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  color:#303030;
  font-size:clamp(42px,4vw,58px);
  line-height:1;
  font-weight:650;
  letter-spacing:-.055em;
  opacity:1;
  transition:opacity 100ms cubic-bezier(.4,0,.6,1);
}

#greeting.tamil{
  font-family:Arial,"Noto Sans Tamil",sans-serif;
  letter-spacing:-.025em;
}

#greeting.devanagari{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  letter-spacing:-.025em;
}

#greeting.konkani{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  color:#f26a21;
  letter-spacing:-.025em;
}

#greeting.cjk{
  font-family:Arial,"Noto Sans",sans-serif;
  letter-spacing:-.035em;
}

#greeting.arabic{
  direction:rtl;
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  letter-spacing:0;
}

/* =========================================================
   BLACK REVEAL
   This is the shape that slides up from the bottom of the
   screen once the greeting cycle finishes.
========================================================= */

#black-reveal{
  position:fixed;
  z-index:1100;
  left:-15vw;
  bottom:-135vh;
  width:130vw;
  height:145vh;
  background:#111;
  border-radius:50% 50% 0 0 / 16% 16% 0 0;
  pointer-events:none;
}

#black-reveal.enter{
  animation:blackReveal 900ms cubic-bezier(.76,0,.24,1) forwards;
}

@keyframes blackReveal{
  from{bottom:-135vh}
  to{bottom:-10vh}
}

#intro.hide{
  animation:introOut 400ms cubic-bezier(.76,0,.24,1) forwards;
}

@keyframes introOut{
  from{opacity:1}
  to{opacity:0}
}

/* Once the intro is done, this class is added to <body>.
   Nothing else in this trimmed file currently reacts to it,
   but it's kept so the next section you add can hook into it. */
body.intro-done{}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){
  *,
  *:before,
  *:after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }

  #intro{
    display:none;
  }

  #black-reveal{
    display:none;
  }
}

</style>
</head>

<body>

<!-- =======================================================
     INTRO
======================================================== -->

<div id="intro">
  <div id="greeting">Hello</div>
</div>

<!-- Starts completely off-screen. It does NOT sit on the
     screen behind the greetings. -->
<div id="black-reveal"></div>


<script>
/* =========================================================
   MULTILINGUAL INTRO
========================================================= */

const greetings = [
  { text:"Hello", type:"" },
  { text:"Bonjour", type:"" },
  { text:"Hola", type:"" },
  { text:"Ciao", type:"" },
  { text:"Hallo", type:"" },
  { text:"Olá", type:"" },
  { text:"வணக்கம்", type:"tamil" },
  { text:"देव बरें करूं", type:"konkani" },
  { text:"こんにちは", type:"cjk" },
  { text:"你好", type:"cjk" },
  { text:"안녕", type:"cjk" },
  { text:"नमस्ते", type:"devanagari" },
  { text:"مرحبا", type:"arabic" },
  { text:"Привет", type:"" }
];

const WORD_TIME = 145;
const FADE_TIME = 95;

const intro = document.getElementById("intro");
const greeting = document.getElementById("greeting");
const blackReveal = document.getElementById("black-reveal");

const reducedMotion =
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;


/* =========================================================
   INTRO SEQUENCE
========================================================= */

function startIntro(){

  if(reducedMotion){
    intro.style.display="none";
    document.body.classList.add("intro-done");
    return;
  }

  let current = 0;

  function changeGreeting(){

    greeting.style.opacity="0";

    setTimeout(() => {

      current++;

      if(current >= greetings.length){
        finishIntro();
        return;
      }

      greeting.textContent =
        greetings[current].text;

      greeting.className =
        greetings[current].type;

      requestAnimationFrame(() => {
        greeting.style.opacity="1";
      });

      setTimeout(
        changeGreeting,
        WORD_TIME
      );

    }, FADE_TIME);
  }


  function finishIntro(){

    setTimeout(() => {

      /*
        IMPORTANT:
        The black oval is still completely off-screen until
        this exact moment.
      */

      blackReveal.classList.add("enter");

      /*
        Let the black shape take over before exposing whatever
        comes next underneath.
      */

      setTimeout(() => {
        document.body.classList.add("intro-done");
      }, 390);

      setTimeout(() => {
        intro.classList.add("hide");
      }, 440);

      setTimeout(() => {
        intro.style.display="none";
        blackReveal.style.display="none";
      }, 1050);

    },170);
  }

  setTimeout(
    changeGreeting,
    WORD_TIME
  );
}


/* =========================================================
   START
========================================================= */

startIntro();

</script>

</body>
</html>
